name: Build & Test

on:
  push:
    branches: ["main", "dev", "feat"]
  pull_request:
    branches: ["main", "dev", "feat"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # billy-inf 为本地强依赖（未发布到 Maven）。CI 需先 checkout 并构建它，
      # 产物 jar 落在 mod-infrastructure/build/libs，由 chunkscanner 的 flatDir 解析。
      - name: Checkout mod-infrastructure
        uses: actions/checkout@v4
        with:
          repository: dx122dx/mod-infrastructure
          path: mod-infrastructure
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build billy-inf
        working-directory: mod-infrastructure
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Build with Gradle
        env:
          BILLY_INF_DIR: mod-infrastructure
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunkscanner-artifacts
          path: build/libs/
          retention-days: 30

  publish-snapshot:
    # 仅在 push / 手动触发时发布，PR 不发布（拿不到 secrets，也不该污染快照仓库）
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: 'Maven publish'
    needs: build
    permissions:
      contents: read
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 与 build job 保持完全一致的目录结构，确保 flatDir 能找到 infrastructure 的 jar
      - name: Checkout mod-infrastructure
        uses: actions/checkout@v4
        with:
          repository: dx122dx/mod-infrastructure
          path: mod-infrastructure
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build billy-inf
        working-directory: mod-infrastructure
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      # 凭证守卫：缺失则跳过后续发布步骤，不报错
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CENTRAL_TOKEN_USERNAME" ] || [ -z "$CENTRAL_TOKEN_PASSWORD" ]; then
            echo "::warning::CENTRAL_TOKEN_USERNAME/PASSWORD 未配置，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 从 mod_version 派生 SNAPSHOT 版本：取主.次.修订三段后拼 -SNAPSHOT
      - name: Derive SNAPSHOT version
        id: ver
        if: steps.creds.outputs.skip != 'true'
        run: |
          MOD_VERSION=$(grep -oE '^mod_version=[^ ]+' gradle.properties | cut -d= -f2)
          BASE=$(echo "$MOD_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$BASE" ]; then
            echo "::error::无法从 mod_version=$MOD_VERSION 派生 SemVer 主干" >&2
            exit 1
          fi
          SNAP="${BASE}-SNAPSHOT"
          echo "原始版本: $MOD_VERSION -> 派生: $SNAP"
          echo "snapshot=$SNAP" >> "$GITHUB_OUTPUT"

      - name: Publish to Maven Central snapshots
        if: steps.creds.outputs.skip != 'true'
        env:
          BILLY_INF_DIR: mod-infrastructure
        run: |
          echo "发布坐标: io.github.dx122dx.mc:chunkscanner:${{ steps.ver.outputs.snapshot }}"
          ./gradlew publishMavenJavaPublicationToCentralSnapshotsRepository \
            -PpublishGroup=io.github.dx122dx.mc \
            -PpublishVersion="${{ steps.ver.outputs.snapshot }}" \
            --no-daemon

      - name: Publish summary
        if: steps.creds.outputs.skip != 'true'
        run: |
          {
            echo "## Maven Central SNAPSHOT 发布"
            echo ""
            echo "- groupId: \`io.github.dx122dx.mc\`"
            echo "- artifactId: \`chunkscanner\`"
            echo "- version: \`${{ steps.ver.outputs.snapshot }}\`"
            echo "- repository: \`central.sonatype.com/repository/maven-snapshots/\`"
          } >> "$GITHUB_STEP_SUMMARY"
