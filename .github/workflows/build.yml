name: Build & Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # billy-inf 为本地强依赖（未发布到 Maven）。CI 需先 checkout 并构建它，
      # 产物 jar 落在 mod-infrastructure/build/libs，由 chunkscanner 的 flatDir 解析。
      - name: Checkout mod-infrastructure
        uses: actions/checkout@v4
        with:
          repository: dx122dx/mod-infrastructure
          path: mod-infrastructure
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build billy-inf
        working-directory: mod-infrastructure
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Build with Gradle
        env:
          BILLY_INF_DIR: mod-infrastructure
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunkscanner-artifacts
          path: build/libs/
          retention-days: 30
